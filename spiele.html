<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spiele · ATSV Jugendtrainer</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="wappen.css?v=1"><style>.game-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.game-tools button{cursor:pointer}.game-panel{margin-top:16px;padding-top:16px;border-top:1px solid #292929}.game-player{display:grid;grid-template-columns:1fr repeat(5,minmax(70px,110px));gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #242424}.game-player input{width:100%}.game-player .name{font-weight:700}.event-form{display:grid;grid-template-columns:1fr 110px 150px auto;gap:8px;align-items:end}.event-list{margin-top:12px}.mini{font-size:.85rem;opacity:.75}@media(max-width:800px){.game-player{grid-template-columns:1fr 70px 70px 70px}.game-player label:nth-child(n+5){grid-column:span 1}.event-form{grid-template-columns:1fr 90px 1fr}}</style></head><body><div class="watermark wm-1">ATSV</div><header class="topbar"><div class="brand"><div class="crest">ATSV<span>1903</span></div><div><strong>ATSV FORCHHEIM</strong><small>JUGENDTRAINER</small></div></div><div class="secure">🔒 Interner Bereich</div></header><main class="shell"><a class="back-link" href="index.html">← Dashboard</a><section class="hero"><div><p class="eyebrow">SPIELVERWALTUNG</p><h1>Spiele <span>verwalten.</span></h1><p class="lead">Kader, Aufstellung, Einsatzzeiten und Spielereignisse direkt am Spiel erfassen.</p></div></section><section class="card"><h2>Neues Spiel</h2><form id="gameForm" class="form-grid"><label>Mannschaft<select id="teamSelect" required><option value="">Mannschaft auswählen…</option></select></label><label>Gegner<input id="opponent" required placeholder="z. B. FC Beispiel"></label><label>Datum<input id="gameDate" type="date" required></label><label>Uhrzeit<input id="gameTime" type="time"></label><label>Ort<input id="location" placeholder="Heim / Auswärts / Sportplatz"></label><button class="primary" type="submit">Spiel speichern</button></form><div id="status" class="status"></div></section><section class="card"><h2>Spiele</h2><div id="games" class="list"></div></section></main><footer>ATSV Forchheim · Jugendtrainer · Interner Bereich</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="spiele.js?v=2"></script></body></html>
