<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spiele · ATSV Jugendtrainer</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="wappen.css?v=1"><style>.game-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.game-panel{margin-top:16px;padding-top:16px;border-top:1px solid #292929}.game-player{display:grid;grid-template-columns:minmax(150px,1fr) repeat(5,minmax(65px,100px));gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #242424}.game-player input{width:100%;box-sizing:border-box}.game-player .name{font-weight:700}.game-player label{min-width:0}.event-form{display:grid;grid-template-columns:1fr 90px 150px auto;gap:8px;align-items:end}.event-list{margin-top:12px}.event-row{padding:8px 0;border-bottom:1px solid #242424}.mini{font-size:.85rem;opacity:.75}.result-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:12px 0}.result-form label{min-width:90px}.result-form input{width:80px}@media(max-width:800px){.game-player{grid-template-columns:minmax(120px,1fr) repeat(5,58px);gap:5px;font-size:13px}.game-player input{font-size:13px;padding:9px 5px}.event-form{grid-template-columns:1fr 80px 1fr}.result-form{align-items:stretch}}@media(max-width:520px){.game-player{grid-template-columns:minmax(110px,1fr) repeat(5,52px);gap:4px;font-size:12px;overflow-x:auto}.game-player .name{overflow-wrap:anywhere}.game-player input{padding:8px 3px}.event-form{grid-template-columns:1fr}.event-form button{width:100%}.result-form{flex-direction:column;align-items:stretch}.result-form label,.result-form input{width:100%}.result-form button{width:100%}}</style></head><body><div class="watermark wm-1">ATSV</div><header class="topbar"><div class="brand"><div class="crest">ATSV<span>1903</span></div><div><strong>ATSV FORCHHEIM</strong><small>JUGENDTRAINER</small></div></div><div class="secure">🔒 Interner Bereich</div></header><main class="shell"><a class="back-link" href="index.html">← Dashboard</a><section class="hero"><div><p class="eyebrow">SPIELVERWALTUNG</p><h1>Spiele <span>verwalten.</span></h1><p class="lead">Kader, Aufstellung, Einsatzzeiten, Ergebnis und Spielereignisse direkt am Spiel erfassen.</p></div></section><section class="card"><h2>Neues Spiel</h2><form id="gameForm" class="form-grid"><label>Mannschaft<select id="teamSelect" required><option value="">Mannschaft auswählen…</option></select></label><label>Gegner<input id="opponent" required placeholder="z. B. FC Beispiel"></label><label>Datum<input id="gameDate" type="date" required></label><label>Uhrzeit<input id="gameTime" type="time"></label><label>Ort<input id="location" placeholder="Heim / Auswärts / Sportplatz"></label><button class="primary" type="submit">Spiel speichern</button></form><div id="status" class="status"></div></section><section class="card"><h2>Spiele</h2><div id="games" class="list"></div></section></main><footer>ATSV Forchheim · Jugendtrainer · Interner Bereich</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="spiele.js?v=4"></script></body></html>
