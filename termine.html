<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Termine · Jugendtrainer</title><link rel="stylesheet" href="style.css?v=1"><link rel="stylesheet" href="wappen.css?v=1"></head><body><div class="page-shell"><header class="topbar"><div><div class="brand">ATSV FORCHHEIM</div><div class="subbrand">JUGENDTRAINER</div></div><div class="secure">🔒 Interner Bereich</div></header><main class="main-content"><a class="back-link" href="index.html">← Dashboard</a><section class="hero"><div><h1>📅 Termine</h1><p>Training, Spiele, Besprechungen und weitere Mannschaftstermine verwalten.</p></div></section><section class="card"><h2>Neuen Termin anlegen</h2><form id="appointmentForm" class="form-grid"><label>Mannschaft<select id="teamSelect" required><option value="">Mannschaft auswählen…</option></select></label><label>Termin<input id="title" required placeholder="z. B. Training"></label><label>Datum<input id="appointmentDate" type="date" required></label><label>Uhrzeit<input id="appointmentTime" type="time"></label><label>Ort<input id="location" placeholder="z. B. Sportplatz"></label><label>Notiz<textarea id="note" rows="3" placeholder="Weitere Informationen…"></textarea></label><button class="primary" type="submit">Termin speichern</button></form><div id="status" class="status"></div></section><section class="card"><h2>Anstehende Termine</h2><div id="appointmentList" class="list"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="termine.js?v=1"></script></body></html>
