<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trainer & Aufgaben · Jugendtrainer</title><link rel="stylesheet" href="style.css?v=1"><link rel="stylesheet" href="wappen.css?v=1"></head><body><div class="page-shell"><header class="topbar"><div><div class="brand">ATSV FORCHHEIM</div><div class="subbrand">JUGENDTRAINER</div></div><div class="secure">🔒 Interner Bereich</div></header><main class="main-content"><a class="back-link" href="index.html">← Dashboard</a><section class="hero"><div><h1>📝 Trainer & Aufgaben</h1><p>Aufgaben im Trainerteam verteilen, Fristen im Blick behalten und Erledigtes abhaken.</p></div></section><section class="card"><h2>Neue Aufgabe</h2><form id="taskForm" class="form-grid"><label>Mannschaft<select id="teamSelect" required><option value="">Mannschaft auswählen…</option></select></label><label>Aufgabe<input id="title" required placeholder="z. B. Spielbericht vorbereiten"></label><label>Zuständig<input id="assignee" placeholder="z. B. Hoffi"></label><label>Fällig am<input id="dueDate" type="date"></label><label>Status<select id="taskStatus"><option value="offen">Offen</option><option value="in_bearbeitung">In Bearbeitung</option><option value="erledigt">Erledigt</option></select></label><label>Notiz<textarea id="note" rows="3" placeholder="Weitere Informationen…"></textarea></label><button class="primary" type="submit">Aufgabe speichern</button></form><div id="status" class="status"></div></section><section class="card"><h2>Aufgaben</h2><div id="taskList" class="list"></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="aufgaben.js?v=1"></script></body></html>
