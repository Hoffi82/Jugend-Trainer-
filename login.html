<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Trainer-Login · ATSV Jugend</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="watermark wm-1">ATSV</div><div class="watermark wm-2">ATSV</div><div class="watermark wm-3">ATSV</div>
<header class="topbar"><div class="brand"><div class="crest">ATSV<span>1903</span></div><div><strong>ATSV FORCHHEIM</strong><small>JUGENDTRAINER</small></div></div><div class="secure">🔒 Nur für Trainer</div></header>
<main class="shell login-shell">
<section class="login-card">
<p class="eyebrow">INTERNER BEREICH</p>
<h1>Trainer-<span>Login</span></h1>
<p class="lead">Melde dich mit deinem eigenen Trainerkonto an.</p>
<form id="loginForm">
<label for="username">Benutzername</label>
<select id="username" required><option value="">Trainer auswählen</option><option value="Hoffi">Hoffi</option><option value="Kai">Kai</option><option value="Marcel">Marcel</option></select>
<label for="password">Passwort</label>
<input id="password" type="password" autocomplete="current-password" required placeholder="Dein eigenes Passwort">
<button class="primary" type="submit">🔐 Anmelden</button>
<p id="loginMessage" class="login-message"></p>
</form>
<p class="login-note">Nur Hoffi, Kai und Marcel sind als Trainer freigeschaltet.</p>
</section>
</main>
<footer>ATSV Forchheim · Jugendtrainer · Interner Bereich</footer>
<script src="login.js"></script>
</body>
</html>
